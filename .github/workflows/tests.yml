name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-serving.txt
      - name: Install the API dependencies
        run: pip install -r requirements-serving.txt pytest httpx
      - name: Run tests (data-dependent tests skip on CI)
        run: pytest -rs
