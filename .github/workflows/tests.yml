name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-serving.txt
      - name: Install dependencies
        run: pip install -r requirements-serving.txt pytest httpx ruff
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (data-dependent tests skip on CI)
        run: pytest -rs
