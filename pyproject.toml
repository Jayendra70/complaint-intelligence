[project]
name = "complaint-intelligence"
version = "1.0.0"
description = "NLP over CFPB consumer complaints: product classification, monetary-relief risk, emerging-issue detection and grounded weekly briefs, served with FastAPI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
